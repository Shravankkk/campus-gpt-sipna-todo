<svg width="1100" height="760" viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CampusGPT Function Flow</title>
  <desc id="desc">Flowchart showing how the CampusGPT functions connect.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb" />
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 18px Arial, sans-serif; fill: #4b5563; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .box-text { font: 14px Arial, sans-serif; fill: #374151; }
      .small { font: 13px Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 3; rx: 14; }
      .app-box { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; rx: 14; }
      .todo-box { fill: #fefce8; stroke: #ca8a04; stroke-width: 3; rx: 14; }
      .gemini-box { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; rx: 14; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1100" height="760" fill="#f8fafc" />

  <text x="550" y="55" text-anchor="middle" class="title">CampusGPT Function Flow</text>
  <text x="550" y="85" text-anchor="middle" class="subtitle">Students fill the yellow TODO functions in campus_gpt.py</text>

  <rect x="60" y="135" width="210" height="90" class="app-box" />
  <text x="165" y="170" text-anchor="middle" class="box-title">app.py</text>
  <text x="165" y="198" text-anchor="middle" class="box-text">Streamlit UI starts here</text>

  <rect x="380" y="115" width="260" height="90" class="todo-box" />
  <text x="510" y="150" text-anchor="middle" class="box-title">load_documents()</text>
  <text x="510" y="178" text-anchor="middle" class="box-text">Read college text files</text>

  <rect x="760" y="115" width="260" height="90" class="todo-box" />
  <text x="890" y="150" text-anchor="middle" class="box-title">make_chunks()</text>
  <text x="890" y="178" text-anchor="middle" class="box-text">Split text into lines</text>

  <rect x="60" y="325" width="210" height="90" class="app-box" />
  <text x="165" y="360" text-anchor="middle" class="box-title">User Question</text>
  <text x="165" y="388" text-anchor="middle" class="box-text">Student asks in chat</text>

  <rect x="380" y="305" width="260" height="90" class="todo-box" />
  <text x="510" y="340" text-anchor="middle" class="box-title">answer_question()</text>
  <text x="510" y="368" text-anchor="middle" class="box-text">Controls the full RAG flow</text>

  <rect x="760" y="270" width="260" height="90" class="todo-box" />
  <text x="890" y="305" text-anchor="middle" class="box-title">search_documents()</text>
  <text x="890" y="333" text-anchor="middle" class="box-text">Find best matching chunks</text>

  <rect x="760" y="430" width="260" height="90" class="todo-box" />
  <text x="890" y="465" text-anchor="middle" class="box-title">clean_text()</text>
  <text x="890" y="493" text-anchor="middle" class="box-text">Lowercase and clean words</text>

  <rect x="380" y="545" width="260" height="90" class="todo-box" />
  <text x="510" y="580" text-anchor="middle" class="box-title">ask_gemini()</text>
  <text x="510" y="608" text-anchor="middle" class="box-text">Send context + question</text>

  <rect x="760" y="545" width="260" height="90" class="gemini-box" />
  <text x="890" y="580" text-anchor="middle" class="box-title">Gemini Model</text>
  <text x="890" y="608" text-anchor="middle" class="box-text">Returns final answer</text>

  <rect x="60" y="545" width="210" height="90" class="app-box" />
  <text x="165" y="580" text-anchor="middle" class="box-title">Answer in App</text>
  <text x="165" y="608" text-anchor="middle" class="box-text">Show answer + sources</text>

  <path d="M270 180 H380" class="arrow" />
  <path d="M640 160 H760" class="arrow" />
  <path d="M270 370 H380" class="arrow" />
  <path d="M640 350 C700 350 700 315 760 315" class="arrow" />
  <path d="M890 360 V430" class="arrow" />
  <path d="M760 475 C700 475 700 350 640 350" class="arrow dashed" />
  <path d="M510 395 V545" class="arrow" />
  <path d="M640 590 H760" class="arrow" />
  <path d="M760 590 H640" class="arrow dashed" />
  <path d="M380 590 H270" class="arrow" />

  <text x="325" y="165" text-anchor="middle" class="small">load docs</text>
  <text x="700" y="145" text-anchor="middle" class="small">documents</text>
  <text x="325" y="355" text-anchor="middle" class="small">question</text>
  <text x="710" y="300" text-anchor="middle" class="small">search</text>
  <text x="940" y="397" text-anchor="middle" class="small">uses</text>
  <text x="700" y="558" text-anchor="middle" class="small">prompt</text>
  <text x="700" y="620" text-anchor="middle" class="small">answer</text>
  <text x="325" y="620" text-anchor="middle" class="small">result</text>
</svg>
